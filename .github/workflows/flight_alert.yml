name: Flight Price Tracker

on:
  schedule:
    # UTC 기준 4시간마다 실행 (한국 시간 01:00, 05:00, 09:00, 13:00, 17:00, 21:00)
    # 하루 6회 × 31일 = 월 최대 186회 호출 (SerpApi 무료 한도 250회 이내)
    - cron: "0 */4 * * *"
  workflow_dispatch: # GitHub 웹페이지에서 수동으로 즉시 실행할 수 있는 버튼

permissions:
  contents: write

jobs:
  track-price:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 항공권 가격 조회 및 디스코드 전송
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python flight_tracker.py

      - name: 누적 가격 데이터 저장소 반영
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.json
          git diff --staged --quiet || git commit -m "chore: update price history"
          git push
