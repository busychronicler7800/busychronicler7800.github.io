name: Auto Reports Pipeline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행할 리포트 종류 선택'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - review
          - worklog

permissions:
  contents: read

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade google-genai yfinance requests

      - name: Run Auto Report Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: 'gemini-4-hydrogen'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE="morning"
          fi
          echo "Running mode: $MODE"
          python scripts/auto_report.py --mode "$MODE"
